import groovy.json.JsonSlurper

plugins {
    id "java"
    id "idea"
}

repositories {
    mavenCentral()
    maven { url = "https://repo.gradle.org/gradle/libs-releases" }
    flatDir { dirs mcreator_path + '/lib' }
}

group = 'dev.mcreator.aicopilot'
version = new JsonSlurper().parse(file('src/main/resources/plugin.json'))['info']['version']

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

configurations {
    implementation.extendsFrom export
}

dependencies {
    implementation project(':MCreator')
}

/* JCEF classes are supplied by the JetBrains Runtime with JCEF, not by a
 * guaranteed standalone jcef.jar under MCreator/jdk. Add available runtime
 * jars to MCreator's compile classpath so its own source can compile.
 */
def jcefRuntimeDirs = []
if (System.getenv("JAVA_HOME")) {
    jcefRuntimeDirs << file(System.getenv("JAVA_HOME") + "/lib")
}
jcefRuntimeDirs << file(mcreator_path + "/jdk/jbr_linux_64/lib")
jcefRuntimeDirs << file(mcreator_path + "/jdk/jbr_win_64/lib")
jcefRuntimeDirs << file(mcreator_path + "/jdk/jbr_mac_x64/Contents/Home/lib")
jcefRuntimeDirs << file(mcreator_path + "/jdk/jbr_mac_aarch64/Contents/Home/lib")

rootProject.project(':MCreator').dependencies {
    jcefRuntimeDirs.each { dir ->
        if (dir.exists()) {
            implementation files(fileTree(dir: dir, include: ['**/*.jar']))
        }
    }
}

project(':MCreator').plugins.withType(IdeaPlugin).configureEach {
    it.model.project = rootProject.idea.project
}

tasks.jar {
    archiveFileName.set("mcreator-ai-copilot-plugin.zip")
    from {
        configurations.export.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.register('runMCreatorWithPlugin', JavaExec) {
    dependsOn jar
    environment("MCREATOR_PLUGINS_FOLDER", file("./build/libs"))
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED', '--enable-native-access=ALL-UNNAMED,jcef'
    classpath = project(':MCreator').sourceSets.main.runtimeClasspath
    mainClass = 'net.mcreator.Launcher'
    workingDir = mcreator_path
}
