import groovy.json.JsonSlurper

plugins {
    id "java"
    id "idea"
}

repositories {
    mavenCentral()
    maven { url = "https://repo.gradle.org/gradle/libs-releases" }
    flatDir { dirs mcreator_path + '/lib' }
}

group = 'dev.mcreator.aicopilot'
version = new JsonSlurper().parse(file('src/main/resources/plugin.json'))['info']['version']

// This follows the current official DemoJavaPlugin template for MCreator 2026.3.
// Build against the exact local MCreator source tree before changing compatibility metadata.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

configurations {
    implementation.extendsFrom export
}

dependencies {
    implementation project(':MCreator')
}

project(':MCreator').plugins.withType(IdeaPlugin).configureEach { ideaPlugin ->
    ideaPlugin.model.project = rootProject.idea.project
}

rootProject.project(':MCreator').afterEvaluate { mcreator ->
    // Reuse MCreator's declared dependencies so the plugin compiles against its actual API.
    mcreator.configurations.named("implementation").get().dependencies.each { dep ->
        dependencies.add("implementation", dep)
    }

    // MCreator's source imports JCEF classes. They ship inside the JetBrains Runtime
    // downloaded by MCreator's initialSetup task, rather than in the source checkout.
    // Add the JCEF API jar to MCreator's own compile classpath before its compile task runs.
    def jcefJars = mcreator.fileTree(dir: "${mcreator_path}/jdk", include: ["**/lib/jcef.jar"])
    if (jcefJars.files.isEmpty()) {
        throw new GradleException(
            "JCEF API jar not found under ${mcreator_path}/jdk. Run the MCreator Gradle task 'initialSetup' first."
        )
    }
    mcreator.dependencies.add("implementation", jcefJars)
}

tasks.jar {
    archiveFileName.set("mcreator-ai-copilot-plugin.zip")
    from {
        configurations.export.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.register('runMCreatorWithPlugin', JavaExec) {
    dependsOn jar
    environment("MCREATOR_PLUGINS_FOLDER", file("./build/libs"))
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    classpath = project(':MCreator').sourceSets.main.runtimeClasspath
    mainClass = 'net.mcreator.Launcher'
    workingDir = mcreator_path
}
