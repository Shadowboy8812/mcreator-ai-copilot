name: Native MCreator plugin build

on:
  workflow_dispatch:
  push:
    paths:
      - "plugin/**"
      - ".github/workflows/native-plugin.yml"

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out AI Copilot
        uses: actions/checkout@v5
      - name: Check out MCreator 2026.2 release source
        uses: actions/checkout@v5
        with:
          repository: MCreator/MCreator
          ref: 2026.2.33518
          path: MCreator
          submodules: recursive
      - name: Set up matching JetBrains JDK 25.0.2 with JCEF
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "25.0.2"
          java-package: jdk+jcef
      - name: Prepare MCreator runtime
        working-directory: MCreator
        run: |
          ./gradlew --no-daemon initialSetup
          echo "MCreator 2026.2 pins JCEF to JetBrains Runtime 25.0.2 (build b329.117)."
          echo "Configured Java runtime:"
          java -version
          echo "JCEF-related runtime files in configured JDK:"
          find -L "$JAVA_HOME" \( -iname '*jcef*' -o -iname '*cef*.jar' \) 2>/dev/null | head -100
          echo "MCreator-managed JBR links:"
          ls -la jdk || true
          echo "JCEF-related runtime files in MCreator-managed JBR:"
          find -L jdk \( -iname '*jcef*' -o -iname '*cef*.jar' \) 2>/dev/null | head -100
      - name: Build native plugin against MCreator 2026.2 source
        run: ./MCreator/gradlew --no-daemon -Pmcreator_path="$GITHUB_WORKSPACE/MCreator" -p "$GITHUB_WORKSPACE/plugin" clean jar
      - name: Verify plugin ZIP contains manifest and entry point
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json

          archives = list(Path("plugin/build/libs").glob("mcreator-ai-copilot-plugin.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one plugin ZIP, found: {archives}")
          with ZipFile(archives[0]) as archive:
              names = set(archive.namelist())
              if "plugin.json" not in names:
                  raise SystemExit("plugin.json is missing from ZIP root")
              if "dev/mcreator/aicopilot/MCreatorAICopilotPlugin.class" not in names:
                  raise SystemExit("Compiled Java plugin entry point is missing")
              manifest = json.loads(archive.read("plugin.json"))
              if manifest.get("javaplugin") != "dev.mcreator.aicopilot.MCreatorAICopilotPlugin":
                  raise SystemExit("Manifest entry point does not match compiled class")
              supported = manifest.get("supportedversions", [])
              if 202600233518 not in supported and 2026002 not in supported:
                  raise SystemExit(f"Plugin does not declare compatibility with MCreator 2026.2: {supported}")
          print(f"Native plugin archive validated for MCreator 2026.2: {archives[0]}")
          PY
      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mcreator-ai-copilot-plugin-2026.2
          path: plugin/build/libs/mcreator-ai-copilot-plugin.zip
          if-no-files-found: error
          retention-days: 14
